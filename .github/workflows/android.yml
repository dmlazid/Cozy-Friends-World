name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules
        run: node --test tests/model.test.mjs
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep test APK signing stable between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cozy-friends-debug-signing-v1
      - name: Build and lint Android app
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cozy-Friends-World-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cozy-Friends-World-0.1.0
          path: Cozy-Friends-World-0.1.0.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test playable world
        run: |
          python3 -m http.server 8080 --directory app/src/main/assets/game &
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gameplay-screenshots
          path: test-results/
