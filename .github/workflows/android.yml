name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules
        run: |
          for file in app/src/main/assets/game/*.mjs; do node --check "$file"; done
          node --test tests/*.test.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install permanent test signing key
        run: bash scripts/install-test-signing-key.sh
      - name: Build and lint Android app
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cozy-Friends-World.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cozy-Friends-World-APK
          path: Cozy-Friends-World.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test playable world
        run: |
          python3 -m http.server 8080 --directory app/src/main/assets/game &
          node tests/browser.cjs
          node tests/play-world.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gameplay-screenshots
          path: test-results/

  publish:
    name: Publish downloadable APK
    needs: [build, gameplay]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cozy-apk-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Cozy-Friends-World-APK
          path: release-apk
      - name: Publish this build and refresh latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-apk.sh
